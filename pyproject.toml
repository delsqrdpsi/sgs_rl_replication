[project]
name = "sgs-rod"
version = "0.1.0"
description = "SGS start-state sampling on UR5e rod-in-hole in MuJoCo Warp"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco==3.17.0",
    "mujoco-warp==3.17.0",
    "numpy",
    "torch",
    "rsl-rl-lib==5.5.1",
    "tensorboard",
    "wandb",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "pytest",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgs_rod"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
